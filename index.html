<style>

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(99,102,241,0.3);border-radius:10px}

/* ANIMAÇÕES */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideRight{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.fade-up{animation:fadeUp .4s cubic-bezier(.16,1,.3,1)}
.fade-in{animation:fadeIn .3s ease}
.slide-right{animation:slideRight .35s cubic-bezier(.16,1,.3,1)}
.ping{animation:ping-red 2s infinite}
/* CARDS */
.card-hover{transition:all .25s cubic-bezier(.16,1,.3,1)}
.card-hover:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.4),0 0 0 1px rgba(99,102,241,0.15)}

.glow-border{position:relative}
.glow-border::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(99,102,241,0.4),rgba(6,182,212,0.2),rgba(139,92,246,0.3));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
/* BOTÕES */
.btn-primary{background:linear-gradient(135deg,#6366f1,#4f46e5);border:none;color:#fff;font-weight:600;transition:all .2s;box-shadow:0 4px 15px rgba(99,102,241,0.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 25px rgba(99,102,241,0.45)}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#cbd5e1;transition:all .2s}
.btn-ghost:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 15px rgba(239,68,68,0.3)}
.btn-danger:hover{box-shadow:0 6px 25px rgba(239,68,68,0.45)}
/* BADGES */
.badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:.02em}
.badge-green{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.2)}
.badge-yellow{background:rgba(234,179,8,0.12);color:#facc15;border:1px solid rgba(234,179,8,0.2)}
.badge-red{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.2)}
.badge-blue{background:rgba(59,130,246,0.12);color:#60a5fa;border:1px solid rgba(59,130,246,0.2)}
.badge-purple{background:rgba(139,92,246,0.12);color:#a78bfa;border:1px solid rgba(139,92,246,0.2)}

.stat-card{background:rgba(17,24,39,0.5);border:1px solid rgba(255,255,255,0.05);border-radius:16px;padding:20px;transition:all .25s cubic-bezier(.16,1,.3,1)}

.progress-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.16,1,.3,1)}
/* TOOLTIP */
[data-tooltip]{position:relative}
[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;padding:8px 12px;border-radius:8px;font-size:11px;line-height:1.4;white-space:normal;width:max-content;max-width:240px;text-align:center;z-index:100;border:1px solid rgba(255,255,255,0.1);pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}

.section-title{font-size:13px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
</style>

// Funções auxiliares do BPM
function getBpmStep(pr){
  // Encontra o step atual pelo último stage_log, casando a FASE exata do BPM.
  // (parsing por número quebrava em sub-etapas 7.1/15.x e na fase 'Medição / Faturamento' sem número)
  var lg=stagelogs.filter(function(l){return l.project_id===pr.id}).sort(function(a,b){return new Date(b.date)-new Date(a.date)})[0];
  if(!lg||!lg.to_stage)return 1;
  var to=lg.to_stage;
  if(to==='Comercial'||to==='Início'||to==='Inicio')return 1;
  // Remove sufixo de pendência para casar a fase base
  var base=to.replace(/ \(pendente\)$/,'');
  var byPhase=BPM.find(function(b){return b.phase===base});
  if(byPhase)return byPhase.step;
  // Fallback legado: extrai número decimal, mas só retorna se o step existir de fato
  var m=base.match(/^(\d+(?:\.\d+)?)[.\s]/);
  if(m){var st=parseFloat(m[1]);if(getBpmByStep(st))return st;}
  return 1;
}
function getBpmByStep(step){return BPM.find(function(b){return b.step===step})}
function getBpmSectorUsers(step){
  var b=getBpmByStep(step);if(!b)return[];
  return gU(b.uuid);
}
function getBpmNextStep(step,allYes){
  var b=getBpmByStep(step);if(!b)return null;
  return allYes?b.nextYes:b.nextNo;
}
function getBpmNotifyUser(step){
  var b=getBpmByStep(step);if(!b)return null;
  if(!b.notify)return null;
  var emails={André:'andre@fujitecbrasil.com.br',Nathalia:'nathalia@fujitecbrasil.com.br',Fábio:'ceo@fujitecbrasil.com.br',Tainá:'taina@fujitecbrasil.com.br'};
  var em=emails[b.notify];if(!em)return null;
  return users.find(function(x){return x.email===em});
}

function getVisited(pid){
  var seen=[];
  stagelogs.filter(function(l){return l.project_id===pid}).forEach(function(l){
    if(l.to_stage&&l.to_stage.indexOf('pendente')<0&&l.to_stage!=='Finalizado'&&seen.indexOf(l.to_stage)<0)
      seen.push(l.to_stage);
  });
  return seen;
}

  if(!u)return;
  var modalOpen=$('modal')&&!$('modal').classList.contains('hidden');
  // Com modal aberto ou vendo detalhe de projeto: atualiza dados/badge em silêncio, sem re-renderizar a tela
  if(modalOpen||viewingDetail){await loadData();return}
  await loadData();renderPage();
},30000);
function renderPage(){viewingDetail=false;if(!hasFullAccess()&&pg!=='fluxos'){pg='fluxos';renderSidebar();}switch(pg){case'dashboard':rDashboard();break;case'empresas':rEmpresas();break;case'fluxos':rFluxos();break;case'projetos':rProjetos();break;case'visao':rVisao();break;case'gargalos':rGargalos();break;case'equipe':rEquipe();break;case'setores':rSetores();break;case'usuarios':rUsuarios();break;case'crm':rCRM();break;case'historico':rHistorico();break}}

// ==================== DASHBOARD EXECUTIVO ====================
var dashCharts=[];
function destroyCharts(){dashCharts.forEach(function(c){try{c.destroy()}catch(e){}});dashCharts=[]}
function fmtBRL(v){return(parseFloat(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
var STATUS_COLORS={'Novo':'#60a5fa','Em alinhamento':'#818cf8','Em andamento':'#a78bfa','Em execução':'#8b5cf6','Concluído':'#4ade80','Finalizado':'#22c55e','Cancelado':'#f87171','Cancelado / Declinado':'#f87171','Declinado':'#f87171'};
function statusColor(st){return STATUS_COLORS[st]||'#94a3b8'}
function isFinal(pr){return pr.status==='Finalizado'||pr.status==='Concluído'}
function isCancel(pr){return(pr.status||'').indexOf('Cancel')>=0||(pr.status||'').indexOf('Declin')>=0}
function isActive(pr){return!isFinal(pr)&&!isCancel(pr)}
function monthKey(d){var x=new Date(d);return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)}
var MES_ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function monthLabel(k){var pp=k.split('-');return MES_ABR[parseInt(pp[1])-1]+'/'+pp[0].slice(2)}
function last6Months(){var out=[],d=new Date();for(var i=5;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2))}return out}

function rDashboard(){
  destroyCharts();
  var mySectors=p?[p.main_sector_id].concat(userSectors.filter(function(us){return us.user_id===p.id}).map(function(us){return us.sector_id})):[];
  var isCeo=p&&p.is_ceo;
  var pjs=isCeo?projects:projects.filter(function(pr){return pr.current_responsible_user_id===u.id||mySectors.indexOf(pr.current_sector_id)>=0});
  var total=pjs.length;
  var finalizados=pjs.filter(isFinal).length;
  var ativos=pjs.filter(isActive);
  var parados=[];ativos.forEach(function(pr){var d=getTimeInSector(pr.id);if(d>3)parados.push({p:pr,dias:d})});
  parados.sort(function(a,b){return b.dias-a.dias});
  var taxa=total>0?Math.round(finalizados/total*100):0;
  var somaDias=0;ativos.forEach(function(pr){somaDias+=getTimeInSector(pr.id)});
  var tempoMedio=ativos.length>0?Math.round(somaDias/ativos.length):0;
  var atrasados=ativos.filter(function(pr){return pr.deadline_at&&new Date(pr.deadline_at)<new Date()});
  var nome=p&&p.name?p.name.split(' ')[0]:'';
  var h='<div class="mb-6"><h2 class="text-xl font-bold text-white">Olá, '+E(nome)+' 👋</h2><p class="text-sm text-slate-400 mt-0.5">'+(isCeo?'Visão executiva de toda a operação — dados em tempo real':'Resumo dos seus projetos e do seu setor')+'</p></div>';
  h+='<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">';
  h+=kpi('📁','Total de Projetos',total,'#818cf8','Todos os projetos do seu escopo — clique para ver a lista',"abrirKpi('total')");
  h+=kpi('🔄','Em Andamento',ativos.length,'#60a5fa','Projetos ativos, ainda não finalizados nem cancelados — clique para ver',"abrirKpi('ativos')");
  h+=kpi('✅','Finalizados',finalizados,'#4ade80','Projetos já concluídos com sucesso — clique para ver',"abrirKpi('finalizados')");
  h+=kpi('⏰','Parados +3 dias',parados.length,parados.length?'#f87171':'#4ade80','Projetos sem movimento há mais de 3 dias — clique para ver',"abrirKpi('parados')");
  h+=kpi('📊','Taxa de Conclusão',taxa+'%',taxa>=50?'#4ade80':'#facc15','Percentual de finalizados sobre o total — clique para ver os concluídos',"abrirKpi('finalizados')");
  h+=kpi('⏱️','Tempo Médio no Setor',tempoMedio+'d',tempoMedio>3?'#f87171':'#4ade80','Média de dias parados no setor atual — clique para ver os mais lentos',"abrirKpi('tempo')");
  h+=kpi('🚩','Prazo Estourado',atrasados.length,atrasados.length?'#f87171':'#4ade80','Projetos ativos com entrega vencida — clique para ver',"abrirKpi('atrasados')");
  h+='</div>';
  h+='<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">';
  h+=chartCard('Projetos por Status','Como estão distribuídos os projetos hoje','ch-status');
  h+=chartCard('Evolução Mensal','Criados x finalizados nos últimos 6 meses','ch-evol');
  h+='</div>';
  h+='<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">';
  h+=chartCard('Projetos Ativos por Setor','Onde estão concentrados os projetos em andamento','ch-setor');
  h+=chartCard('Projetos por Empresa','Volume de projetos por cliente','ch-emp');
  h+='</div>';
  if(parados.length>0){
    h+='<div class="mb-6 bg-red-500/5 border border-red-500/20 rounded-2xl p-5"><h3 class="text-sm font-semibold text-red-400 mb-3 flex items-center gap-2">⚠️ Precisam de atenção <span class="badge badge-red">'+parados.length+'</span></h3><div class="space-y-2">';
    parados.slice(0,8).forEach(function(g){h+='<div class="flex items-center gap-3 bg-card2 rounded-xl p-3 border border-slate-700 cursor-pointer hover:ring-1 hover:ring-red-500/30 transition" onclick="verProjeto(\''+g.p.id+'\')"><span class="w-2 h-2 rounded-full flex-shrink-0" style="background:'+sc(g.p.current_sector_id)+'"></span><span class="text-sm text-white flex-1 min-w-0 truncate">'+E(g.p.name)+'</span><span class="badge hidden md:inline-block" style="background:'+sc(g.p.current_sector_id)+'20;color:'+sc(g.p.current_sector_id)+'">'+sn(g.p.current_sector_id)+'</span><span class="text-xs text-red-400 font-semibold w-12 text-right">'+g.dias+'d</span></div>'});
    h+='</div></div>';
  }
  h+='<h3 class="section-title">Distribuição por Setor</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-3">';
  sectors.filter(function(x){return x.active}).forEach(function(sec){var c=ativos.filter(function(pr){return pr.current_sector_id===sec.id}).length;h+='<div class="bg-card2 rounded-2xl p-4 border border-slate-800 cursor-pointer card-hover" style="border-left:4px solid '+sec.color+'" onclick="filtrarSetor(\''+sec.id+'\')"><span class="text-sm font-medium text-white">'+E(sec.name)+'</span><p class="text-2xl font-bold mt-1" style="color:'+sec.color+'">'+c+'</p></div>'});h+='</div>';
  $('content').innerHTML=h;
  buildDashCharts(pjs,ativos);
}
function kpi(icon,label,val,color,tip,action){return'<div class="stat-card card-hover cursor-pointer" style="border-top:2px solid '+color+'40" data-tooltip="'+tip+'" onclick="'+(action||'')+'"><div class="flex items-center justify-between"><span class="text-lg">'+icon+'</span><span class="text-slate-600 text-xs">›</span></div><p class="text-xs text-slate-500 uppercase tracking-wide font-medium mt-2">'+label+'</p><p class="text-2xl font-bold mt-1" style="color:'+color+'">'+val+'</p></div>'}
function abrirKpi(tipo){
  var mySectors=p?[p.main_sector_id].concat(userSectors.filter(function(us){return us.user_id===p.id}).map(function(us){return us.sector_id})):[];
  var base=(p&&p.is_ceo)?projects:projects.filter(function(pr){return pr.current_responsible_user_id===u.id||mySectors.indexOf(pr.current_sector_id)>=0});
  var list=base,ttl='Projetos';
  if(tipo==='total'){ttl='Todos os projetos';}
  else if(tipo==='ativos'){list=base.filter(isActive);ttl='Em andamento';}
  else if(tipo==='finalizados'){list=base.filter(isFinal);ttl='Finalizados';}
  else if(tipo==='parados'){list=base.filter(function(pr){return isActive(pr)&&getTimeInSector(pr.id)>3});ttl='Parados +3 dias';}
  else if(tipo==='atrasados'){list=base.filter(function(pr){return isActive(pr)&&pr.deadline_at&&new Date(pr.deadline_at)<new Date()});ttl='Prazo estourado';}
  else if(tipo==='tempo'){list=base.filter(isActive).slice().sort(function(a,b){return getTimeInSector(b.id)-getTimeInSector(a.id)});ttl='Ativos (mais tempo parado primeiro)';}
  pg='projetos';renderSidebar();
  if(!list.length){$('content').innerHTML='<div class="text-center py-16 glass rounded-2xl"><div class="text-5xl mb-3">📭</div><p class="text-slate-400">Nenhum projeto em "'+ttl+'"</p><button onclick="nav(\'dashboard\')" class="mt-4 btn-ghost px-4 py-2 text-xs rounded-xl">← Voltar ao Dashboard</button></div>';return}
  renderList(list,ttl);
}
function chartCard(title,sub,id){return'<div class="glass rounded-2xl p-5 border border-white/5"><h3 class="text-sm font-semibold text-white">'+title+'</h3><p class="text-xs text-slate-500 mb-3">'+sub+'</p><div style="position:relative;height:240px"><canvas id="'+id+'"></canvas></div></div>'}
function crd(l,v,c){var col=(c==='white'||!c)?'#e2e8f0':c;return'<div class="stat-card card-hover" style="border-top:2px solid '+col+'40"><div class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full" style="background:'+col+'"></span><p class="text-xs text-slate-500 uppercase tracking-wide font-medium">'+l+'</p></div><p class="text-3xl font-bold mt-2" style="color:'+col+'">'+v+'</p></div>'}
function buildDashCharts(pjs,ativos){
  if(!window.Chart)return;
  var stCount={};pjs.forEach(function(pr){var st=pr.status||'Novo';stCount[st]=(stCount[st]||0)+1});
  var stKeys=Object.keys(stCount);
  mkDoughnut('ch-status',stKeys,stKeys.map(function(k){return stCount[k]}),stKeys.map(statusColor));
  var months=last6Months();
  var criados=months.map(function(m){return pjs.filter(function(pr){return pr.created_at&&monthKey(pr.created_at)===m}).length});
  var fins=months.map(function(m){return pjs.filter(function(pr){return pr.finalized_at&&monthKey(pr.finalized_at)===m}).length});
  mkLine('ch-evol',months.map(monthLabel),[{label:'Criados',data:criados,color:'#60a5fa'},{label:'Finalizados',data:fins,color:'#4ade80'}]);
  var secs=sectors.filter(function(x){return x.active});
  var secL=[],secF=[],secC=[];secs.forEach(function(sec){var n=ativos.filter(function(pr){return pr.current_sector_id===sec.id}).length;if(n>0){secL.push(sec.name);secF.push(n);secC.push(sec.color==='#ffffff'?'#e2e8f0':sec.color)}});
  mkBar('ch-setor',secL,secF,secC,true);
  var empCount={};pjs.forEach(function(pr){if(!pr.empresa_id)return;empCount[pr.empresa_id]=(empCount[pr.empresa_id]||0)+1});
  var empArr=Object.keys(empCount).map(function(e){return{nome:(empresas.find(function(x){return x.id===e})||{}).nome||'—',n:empCount[e]}}).sort(function(a,b){return b.n-a.n}).slice(0,8);
  mkBar('ch-emp',empArr.map(function(x){return x.nome}),empArr.map(function(x){return x.n}),empArr.map(function(){return'#818cf8'}),false);
}
function mkDoughnut(id,labels,data,colors){var el=$(id);if(!el)return;if(!data.length){emptyChart(el);return}dashCharts.push(new Chart(el,{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:colors,borderColor:'rgba(15,23,42,0.6)',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{color:'#cbd5e1',font:{size:11},boxWidth:12,padding:10}}}}}))}
function mkLine(id,labels,series){var el=$(id);if(!el)return;dashCharts.push(new Chart(el,{type:'line',data:{labels:labels,datasets:series.map(function(sr){return{label:sr.label,data:sr.data,borderColor:sr.color,backgroundColor:sr.color+'22',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:sr.color}})},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#cbd5e1',font:{size:11},boxWidth:12}}},scales:{x:{ticks:{color:'#94a3b8'},grid:{color:'rgba(255,255,255,0.04)'}},y:{beginAtZero:true,ticks:{color:'#94a3b8',precision:0},grid:{color:'rgba(255,255,255,0.04)'}}}}}))}
function mkBar(id,labels,data,colors,horizontal){var el=$(id);if(!el)return;if(!data.length){emptyChart(el);return}dashCharts.push(new Chart(el,{type:'bar',data:{labels:labels,datasets:[{data:data,backgroundColor:colors,borderRadius:6,maxBarThickness:34}]},options:{indexAxis:horizontal?'y':'x',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return' '+c.parsed[horizontal?'x':'y']+' projeto(s)'}}}},scales:{x:{ticks:{color:'#94a3b8',precision:0},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#94a3b8',precision:0},grid:{color:'rgba(255,255,255,0.04)'}}}}}))}
function emptyChart(el){var d=document.createElement('div');d.className='flex items-center justify-center h-full text-slate-600 text-xs';d.textContent='Sem dados ainda';el.parentNode.replaceChild(d,el)}
function filtrarSetor(sid){pg='projetos';renderSidebar();rProjetosSetor(sid)}

function rEmpresas(){
  var btn=canCreate()?'<button onclick="showNovaEmpresa()" class="px-4 py-2 bg-brand-600 text-white text-sm font-medium rounded-xl">+ Nova Empresa</button>':'';
  var h='<div class="flex justify-between mb-6"><p class="text-sm text-slate-400">'+empresas.length+' empresa(s)</p>'+btn+'</div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';
  empresas.forEach(function(emp){var cp=projects.filter(function(pr){return pr.empresa_id===emp.id}).length;h+='<div class="bg-card2 rounded-2xl p-5 border border-slate-800"><div class="flex justify-between"><h3 class="font-semibold text-white text-lg">'+E(emp.nome)+'</h3>'+(canCreate()?'<button onclick="event.stopPropagation();showEditarEmpresa(\''+emp.id+'\')" class="text-xs text-brand-400">✏️</button>':'')+'</div>'+(emp.cnpj?'<p class="text-xs text-slate-500">CNPJ: '+E(emp.cnpj)+'</p>':'')+'<p class="text-brand-400 text-sm mt-3 cursor-pointer" onclick="filtrarEmpresa(\''+emp.id+'\')">'+cp+' projetos →</p><p class="text-xs text-slate-500 mt-1 cursor-pointer hover:text-brand-400" onclick="rHistoricoEmpresa(\''+emp.id+'\')">🕐 Ver histórico da empresa</p></div>'});h+='</div>';$('content').innerHTML=h;
}
function showNovaEmpresa(){showModal('Nova Empresa','<div class="space-y-3"><div><label class="text-xs text-slate-400">Nome *</label><input id="ef-nome" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"></div><div><label class="text-xs text-slate-400">CNPJ</label><input id="ef-cnpj" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"></div></div>','<button onclick="hideModal()" class="px-4 py-2 bg-input text-slate-300 rounded-xl text-sm">Cancelar</button><button onclick="criarEmpresa()" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-medium">Criar</button>')}
async function criarEmpresa(){var nome=$('ef-nome').value.trim();if(!nome)return alert('Nome obrigatório');await s.from('empresas').insert({nome:nome,cnpj:$('ef-cnpj').value.trim()});hideModal();await loadData();renderPage()}
function showEditarEmpresa(eid){var emp=empresas.find(function(x){return x.id===eid});if(!emp)return;showModal('Editar','<div class="space-y-3"><div><label class="text-xs text-slate-400">Nome</label><input id="edef-nome" value="'+E(emp.nome)+'" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"></div><div><label class="text-xs text-slate-400">CNPJ</label><input id="edef-cnpj" value="'+E(emp.cnpj)+'" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"></div></div>','<button onclick="hideModal()" class="px-4 py-2 bg-input text-slate-300 rounded-xl text-sm">Cancelar</button><button onclick="salvarEmpresa(\''+eid+'\')" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-medium">Salvar</button>')}
async function salvarEmpresa(eid){await s.from('empresas').update({nome:$('edef-nome').value.trim(),cnpj:$('edef-cnpj').value.trim()}).eq('id',eid);hideModal();await loadData();renderPage()}
function filtrarEmpresa(eid){pg='projetos';renderSidebar();rProjetosEmpresa(eid)}
function rHistoricoEmpresa(eid){
  pg='historico';renderSidebar();viewingDetail=true;
  var emp=empresas.find(function(x){return x.id===eid});
  var pjs=projects.filter(function(pr){return pr.empresa_id===eid});
  var h='<div class="mb-4"><button onclick="nav(\'empresas\')" class="text-xs text-brand-400">← Empresas</button><h3 class="text-lg font-semibold text-white mt-1">🕐 Histórico — '+E(emp?emp.nome:'')+'</h3><p class="text-sm text-slate-400">'+pjs.length+' projeto(s) — cada um com o seu histórico separado</p></div>';
  if(!pjs.length)h+='<div class="text-center py-12 text-slate-500">Nenhum projeto para esta empresa.</div>';
  pjs.forEach(function(pr){
    var logs=stagelogs.filter(function(l){return l.project_id===pr.id}).sort(function(a,b){return new Date(b.date)-new Date(a.date)});
    h+='<div class="mb-4 glass rounded-2xl p-4 border border-white/5"><div class="flex justify-between items-center mb-2 cursor-pointer" onclick="verProjeto(\''+pr.id+'\')"><h4 class="font-semibold text-white">'+E(pr.name)+' <span class="text-xs text-slate-500 font-mono">#'+E(pr.code||'')+'</span></h4><span class="text-xs text-brand-400 flex-shrink-0">abrir projeto →</span></div>';
    if(!logs.length)h+='<p class="text-xs text-slate-600">Sem movimentações ainda.</p>';
    h+='<div class="space-y-1">';
    logs.forEach(function(l,i){var nextLog=i>0?logs[i-1]:null;var durMs=nextLog?(new Date(nextLog.date)-new Date(l.date)):(Date.now()-new Date(l.date));h+='<div class="bg-card2 rounded-lg px-3 py-2 text-xs border border-slate-800"><div class="flex gap-2 items-center"><span class="text-slate-600 w-12 flex-shrink-0">'+ago(l.date)+'</span><span class="text-slate-300 flex-1 min-w-0">'+E(l.from_stage||'Início')+' → '+E(l.to_stage)+'</span><span class="text-slate-500 whitespace-nowrap flex-shrink-0">⏱ '+fmtDur(durMs)+(nextLog?'':' (atual)')+'</span></div>'+(isRealNote(l.notes)?'<div class="text-amber-300/80 mt-1">📝 '+E(l.notes)+'</div>':'')+'</div>'});
    h+='</div></div>';
  });
  $('content').innerHTML=h;
}

function rProjetos(){renderList(projects,'Todos')}
function rProjetosSetor(sid){renderList(projects.filter(function(pr){return pr.current_sector_id===sid}),sn(sid))}
function rProjetosEmpresa(eid){renderList(projects.filter(function(pr){return pr.empresa_id===eid}),empresas.find(function(x){return x.id===eid})?.nome||'')}
function renderList(pjs,ttl){
  var btn=canCreate()?'<button onclick="showNovoProjeto()" class="px-4 py-2 bg-brand-600 text-white text-sm font-medium rounded-xl">+ Novo Projeto</button>':'';
  var h='<div class="flex justify-between mb-6"><div><button onclick="nav(\'projetos\')" class="text-xs text-brand-400">&larr; Todos</button><p class="text-sm text-slate-400 mt-1">'+pjs.length+' projetos · '+ttl+'</p></div>'+btn+'</div><div class="space-y-3">';
  pjs.forEach(function(pr){var b=pr.current_responsible_user_id===u.id?'border-red-500':'border-slate-700';var dias=getTimeInSector(pr.id);var td=dias>3?'text-red-400':dias>1?'text-yellow-400':'text-green-400';h+='<div class="bg-card2 rounded-2xl p-5 border '+b+' hover:ring-1 hover:ring-brand-500/30 transition fade-up"><div class="flex justify-between items-start"><div class="cursor-pointer flex-1" onclick="verProjeto(\''+pr.id+'\')"><span class="text-xs text-slate-500 font-mono">#'+E(pr.code||'')+'</span><h3 class="font-semibold text-white mt-1">'+E(pr.name)+'</h3><p class="text-xs text-slate-400">'+E(empresas.find(function(x){return x.id===pr.empresa_id})?.nome||'---')+'</p></div><div class="flex gap-1"><button onclick="event.stopPropagation();showEditarProjeto(\''+pr.id+'\')" class="text-xs px-3 py-1.5 rounded-xl bg-input text-slate-300">✏️</button>'+(canAvancar(pr)?'<button onclick="event.stopPropagation();showAvancar(\''+pr.id+'\')" class="text-xs px-3 py-1.5 rounded-xl bg-brand-600 text-white">▶ Avançar</button>':'')+'</div></div><div class="flex flex-wrap gap-2 items-center mt-3 text-xs"><span style="color:'+sc(pr.current_sector_id)+'">● '+sn(pr.current_sector_id)+'</span><span class="'+td+'">⏱ '+tempoTxt(pr.id)+'</span><span class="text-slate-500">👤 '+un(pr.current_responsible_user_id)+'</span>'+prioBadge(pr)+prazoTxt(pr)+'</div></div>'});h+='</div>';$('content').innerHTML=h;
}
function showNovoProjeto(){

  var curStep=getBpmStep(pr);

// Roteador único do fluxo: respeita nextYes E nextNo (o NÃO agora encaminha de verdade)
function bpmRoute(b,allYes){
  var nxtStep=allYes?b.nextYes:b.nextNo;
  var nxtBpm=getBpmByStep(nxtStep);
  var kind,newTo;
  if(nxtStep===-1){kind='final';newTo='Finalizado';}
  else if(nxtStep===-2){kind='cancel';newTo='Declinado';}
  else if(!nxtBpm||nxtStep===b.step){kind='pend';newTo=b.phase+' (pendente)';}
  else{kind='move';newTo=nxtBpm.phase;}
  return{nxtStep:nxtStep,nxtBpm:nxtBpm,kind:kind,newTo:newTo};
}
// Responsáveis de uma etapa: usuários do setor + os NOMEADOS no campo resp

  users.forEach(function(us){if(nomes.indexOf(us.name)>=0&&lista.indexOf(us)<0)lista.push(us)});
  return lista;
}

async function doAv(){
  var pid=pidAv,pr=projects.find(function(x){return x.id===pid});if(!pr)return;
  var curStep=getBpmStep(pr);
  var b=getBpmByStep(curStep);if(!b)return;
  var allYes=dec.indexOf('❌')<0;
  var r=bpmRoute(b,allYes);
  var resp=$('av-resp')?$('av-resp').value:'',notes=$('av-notes')?$('av-notes').value.trim():'';
  if(!resp)return alert('Selecione um responsavel');
  var uResp=users.find(function(x){return x.id===resp});
  if(!uResp)return alert('Responsavel invalido');

  // Trilha paralela: se etapa 11 com SIM, pega o responsável da trilha 2
  var respParalelo=null,uRespParalelo=null;
  var isEtapa11Paralelo=(b.step===11&&allYes&&r.kind==='move');
  if(isEtapa11Paralelo){
    respParalelo=$('av-resp-paralelo')?$('av-resp-paralelo').value:null;
    if(respParalelo)uRespParalelo=users.find(function(x){return x.id===respParalelo});
  }

  var lastLog=stagelogs.filter(function(l){return l.project_id===pid}).sort(function(a,b){return new Date(b.date)-new Date(a.date)})[0];
  if(lastLog&&lastLog.to_stage===r.newTo&&lastLog.from_stage===b.phase){
    return alert('Este avanço já foi registrado. Atualize a página.');
  }
  var upd,toStage,ntype,ntitle,nmsg;
  if(r.kind==='cancel'){upd={current_responsible_user_id:resp,status:'Cancelado / Declinado',finalized_at:new Date().toISOString()};toStage='Declinado';ntype='declined';ntitle='⛔ Declinado: '+E(pr.name);nmsg='Projeto '+E(pr.name)+' declinado';}
  else if(r.kind==='final'){upd={current_responsible_user_id:resp,status:'Finalizado',finalized_at:new Date().toISOString()};toStage='Finalizado';ntype='finalized';ntitle='🏁 Finalizado: '+E(pr.name);nmsg='Projeto '+E(pr.name)+' finalizado';}
  else if(r.kind==='move'){upd={current_sector_id:r.nxtBpm.uuid,current_responsible_user_id:resp,status:'Em andamento'};if(isEtapa11Paralelo){upd.paralelo_ativo=true;upd.paralelo_responsavel_id=respParalelo}toStage=r.nxtBpm.phase;ntype='flow_received';ntitle='✅ '+r.nxtBpm.phase;nmsg='Projeto '+E(pr.name)+' avançou. Resp: '+E(uResp.name);}
  else{upd={current_responsible_user_id:resp};toStage=b.phase+' (pendente)';ntype='stalled';ntitle='⏳ Pendência: '+E(pr.name);nmsg='Projeto '+E(pr.name)+' pendente em '+b.phase;}
  var upRes=await s.from('projects').update(upd).eq('id',pid);

  // Trilha paralela: criar 2 stage_logs (um pra cada trilha)
  if(isEtapa11Paralelo&&respParalelo){
    await s.from('stage_logs').insert({project_id:pid,from_stage:b.phase,to_stage:toStage,user_id:u.id,notes:notes||dec,track:'principal'});
    var etapa31=getBpmByStep(31);
    if(etapa31)await s.from('stage_logs').insert({project_id:pid,from_stage:b.phase,to_stage:etapa31.phase,user_id:u.id,notes:'Trilha paralela iniciada',track:'paralelo'});
  }else{
    var slRes=await s.from('stage_logs').insert({project_id:pid,from_stage:b.phase,to_stage:toStage,user_id:u.id,notes:notes||dec,track:'principal'});
    if(slRes&&slRes.error){alert('⚠️ O projeto avançou, mas o histórico não salvou:\n'+slRes.error.message);}
  }

  await s.from('notifications').insert({project_id:pid,user_id:resp,type:ntype,title:ntitle,message:nmsg,status:'pendente'});
  if(isEtapa11Paralelo&&respParalelo){
    await s.from('notifications').insert({project_id:pid,user_id:respParalelo,type:'flow_received',title:'🔀 Trilha paralela: 31. Análise Documentação Técnica',message:'Trilha de engenharia iniciada para '+E(pr.name),status:'pendente'});
  }
  var gestor=getBpmNotifyUser(curStep);
  if(gestor&&gestor.id!==resp){
    await s.from('notifications').insert({project_id:pid,user_id:gestor.id,type:'flow_received',title:'📢 '+b.phase,message:((r.kind==='move'||r.kind==='final')?'✅ Avançou':'⏳ Pendência')+' | '+E(pr.name)+' | '+E(uResp.name),status:'pendente'});
  }
  try{await s.from('notifications').update({status:'enviado'}).eq('user_id',u.id).eq('project_id',pid).eq('status','pendente')}catch(e){}
  hideModal();await loadData();renderPage();
}

function rFluxos(){

  var meusSetoresNomes=meusSetores.map(function(sid){return sn(sid)}).filter(function(v,i,a){return a.indexOf(v)===i});
  var pjs=projects.filter(function(pr){return pr.current_responsible_user_id===u.id});
  var h='<div class="mb-6 glass-strong rounded-2xl p-5 glow-border"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-500 to-accent-500 flex items-center justify-center text-lg font-black text-white shadow-lg shadow-brand-500/20">'+(p&&p.name?p.name[0]:'?')+'</div><div><h3 class="text-lg font-bold text-white">'+E(p?p.name:'')+'</h3><p class="text-xs text-slate-400">'+E(p?p.email:'')+'</p><div class="flex flex-wrap gap-1 mt-1.5">';

  if(pjs.length===0){h+='<div class="text-center py-16 glass rounded-2xl"><div class="text-5xl mb-3">📭</div><p class="text-slate-400">Nenhuma atividade pendente</p><p class="text-xs text-slate-600 mt-1">Quando um projeto chegar no seu setor, aparecerá aqui</p></div>';$('content').innerHTML=h;return}
  h+='<div class="space-y-3">';

function verProjeto(pid){
  var pr=projects.find(function(x){return x.id===pid});if(!pr)return;

  var logs=stagelogs.filter(function(x){return x.project_id===pid}).sort(function(a,b){return new Date(b.date)-new Date(a.date)});

  var btnEdit=canEdit()?'<button onclick="showEditarProjeto(\''+pid+'\')" class="px-3 py-1.5 text-xs bg-input text-slate-300 rounded-xl">✏️</button>':'';
  var btnDel=canDelete()?'<button onclick="excluirProjeto(\''+pid+'\')" class="px-3 py-1.5 text-xs bg-red-600 text-white rounded-xl">🗑</button>':'';

  var prazoVenc=pr.deadline_at&&new Date(pr.deadline_at)<new Date()&&pr.status!=='Finalizado';
  h+='<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">'+dc2('Setor',sn(pr.current_sector_id),sc(pr.current_sector_id))+dc2('Status',pr.status,'')+dc2('Responsavel',un(pr.current_responsible_user_id),'')+dc2('Prioridade',pr.priority||'Normal',prioColor(pr))+dc2('Prazo',pr.deadline_at?fd(pr.deadline_at):'—',prazoVenc?'#f87171':'')+dc2('Criado',fd(pr.created_at),'')+dc2('⏱ No setor',tempoTxt(pid),(diasNoSetor>3?'#f87171':diasNoSetor>1?'#fbbf24':'#4ade80'))+'</div>';
  h+='<h4 class="text-sm font-semibold text-white mb-2">📊 Auditoria (tempo por etapa)</h4>';
  var tempoTotalMs=logs.length?(Date.now()-new Date(logs[logs.length-1].date).getTime()):0;
  var mediaMs=logs.length>1?tempoTotalMs/(logs.length-1):tempoTotalMs;
  h+='<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">';
  h+=dc2('Transições',logs.length,'#6366f1')+dc2('No setor atual',tempoTxt(pid),diasNoSetor>3?'#f87171':diasNoSetor>1?'#fbbf24':'#4ade80')+dc2('Tempo Total',fmtDur(tempoTotalMs),'#a78bfa')+dc2('Média/Etapa',fmtDur(mediaMs),mediaMs>7*86400000?'#f87171':'#4ade80');
  h+='</div>';
  h+='<h4 class="text-sm font-semibold text-white mb-2">🕐 Historico</h4><div class="space-y-1">';
  logs.forEach(function(l,i){var dt=ago(l.date);var nextLog=i>0?logs[i-1]:null;var durMs=nextLog?(new Date(nextLog.date)-new Date(l.date)):(Date.now()-new Date(l.date));var dur=fmtDur(durMs)+(nextLog?'':' (atual)');var udur=!nextLog?'text-green-400':(durMs>86400000?'text-amber-400':'text-slate-500');h+='<div class="bg-card2 rounded-xl p-3 border border-slate-800 text-sm"><div class="flex gap-3 items-center"><span class="text-xs text-slate-600 w-14 flex-shrink-0">'+dt+'</span><span class="text-slate-300 flex-1 min-w-0">'+E(l.from_stage||'Início')+' → '+E(l.to_stage)+'</span><span class="text-xs '+udur+' text-right whitespace-nowrap flex-shrink-0">⏱ '+dur+'</span><span class="text-xs text-slate-600 w-20 text-right flex-shrink-0 hidden md:inline">👤 '+un(l.user_id)+'</span></div>'+(isRealNote(l.notes)?'<div class="text-xs text-amber-300/80 mt-2">📝 '+E(l.notes)+'</div>':'')+'</div>'});
  h+='</div>';$('content').innerHTML=h;
}
function dc2(l,v,c){var cl=(c==='white'||!c)?'#e2e8f0':c;return'<div class="stat-card"><p class="text-xs text-slate-500 uppercase tracking-wide">'+l+'</p><p style="color:'+cl+'" class="font-semibold mt-1 text-lg">'+E(v)+'</p></div>'}
// Helpers de prioridade, prazo e observação (visíveis para todos)
function prioColor(pr){return {'Urgente':'#f87171','Alta':'#fb923c','Baixa':'#94a3b8','Normal':'#60a5fa'}[(pr&&pr.priority)||'Normal']||'#60a5fa'}
function prioBadge(pr){var pri=(pr&&pr.priority)||'Normal';var c=prioColor(pr);var ic={'Urgente':'🔴','Alta':'🟠','Baixa':'⚪','Normal':'🔵'}[pri]||'🔵';return'<span class="badge" style="background:'+c+'20;color:'+c+';border:1px solid '+c+'40">'+ic+' '+pri+'</span>'}
function prazoTxt(pr){if(!pr||!pr.deadline_at)return'';var venc=new Date(pr.deadline_at)<new Date()&&pr.status!=='Finalizado';var cor=venc?'#f87171':'#94a3b8';return'<span class="text-xs" style="color:'+cor+'">📅 '+fd(pr.deadline_at)+(venc?' (vencido)':'')+'</span>'}
function isRealNote(n){return !!(n&&n.replace(/[✅❌\s|]/g,'').length>0&&n!=='Projeto criado')}
function lastNote(pid){var lg=stagelogs.filter(function(l){return l.project_id===pid}).sort(function(a,b){return new Date(b.date)-new Date(a.date)})[0];return (lg&&isRealNote(lg.notes))?lg.notes:''}

}

  h+='</div><button onclick="novaEtapaCRM()" class="w-full btn-ghost py-2 mt-3 text-xs rounded-xl">+ Nova etapa</button>';
  showModal('Gerenciar Etapas do CRM',h,'<button onclick="hideModal()" class="px-4 py-2 bg-input text-slate-300 rounded-xl text-sm">Fechar</button>');
}
function editarEtapaCRM(stid){
  var st=crmStages.find(function(x){return x.id===stid});if(!st)return;
  var b='<div class="space-y-3"><input id="crm-nome" value="'+E(st.nome)+'" placeholder="Nome da etapa" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm">'+
    '<select id="crm-tipo" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"><option value="normal"'+(st.tipo==='normal'?' selected':'')+'}>Normal</option><option value="ganho"'+(st.tipo==='ganho'?' selected':'')+'}>Ganho</option><option value="perdido"'+(st.tipo==='perdido'?' selected':'')+'}>Perdido</option></select>'+
    '<input id="crm-ordem" type="number" value="'+(st.ordem||0)+'" placeholder="Ordem (0, 1, 2...)" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm">'+
    '<input id="crm-cor" type="color" value="'+(st.cor||'#6366f1')+'" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 cursor-pointer">'+
    '</div>';
  showModal('Editar — '+E(st.nome),b,'<button onclick="hideModal()" class="px-4 py-2 bg-input rounded-xl text-sm">Cancelar</button><button onclick="salvarEtapaCRM(\''+stid+'\')" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-medium">Salvar</button>');
}
async function salvarEtapaCRM(stid){
  var upd={nome:$('crm-nome').value,tipo:$('crm-tipo').value,ordem:parseInt($('crm-ordem').value)||0,cor:$('crm-cor').value};
  await s.from('crm_stages').update(upd).eq('id',stid);hideModal();await loadData();renderPage();
}
async function novaEtapaCRM(){
  var nome=prompt('Nome da nova etapa:');if(!nome)return;
  await s.from('crm_stages').insert({nome:nome,ordem:(crmStages.length||0),tipo:'normal',editores:[u.id]});
  await loadData();gerenciarEtapasCRM();
}
function verLead(lid){
  var l=leads_global.find(function(x){return x.id===lid});if(!l)return;
  var st=crmStages.find(function(x){return x.id===l.stage_id});
  var b='<div class="space-y-3"><div><label class="text-xs text-slate-400">Nome</label><p class="text-white font-medium">'+E(l.nome)+'</p></div>'+
    '<div><label class="text-xs text-slate-400">Empresa</label><p class="text-slate-300">'+E(l.empresa||'—')+'</p></div>'+
    '<div><label class="text-xs text-slate-400">Contato</label><p class="text-slate-300">'+E(l.contato_email||'—')+' · '+E(l.contato_telefone||'—')+'</p></div>'+
    '<div><label class="text-xs text-slate-400">Valor estimado</label><p class="text-green-400 font-medium">R$ '+(l.valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2})+'</p></div>'+
    '<div><label class="text-xs text-slate-400">Etapa</label><p class="text-slate-300">'+E(st?st.nome:'—')+'</p></div>'+
    '<div><label class="text-xs text-slate-400">Responsável</label><p class="text-slate-300">'+E((users.find(function(x){return x.id===l.responsavel_id})||{}).name||'—')+'</p></div>'+
    '<div><label class="text-xs text-slate-400">Próxima ação</label><p class="text-slate-300">'+E(l.proxima_acao||'—')+(l.proxima_data?' até '+new Date(l.proxima_data).toLocaleDateString('pt-BR'):'')+'</p></div>'+
    '<div><label class="text-xs text-slate-400">Notas</label><p class="text-slate-300 text-sm">'+E(l.notas||'—')+'</p></div>';
  if(canEditStage(st||{})){b+='<button onclick="editarLead(\''+lid+'\')" class="w-full btn-ghost py-2 rounded-xl text-sm">✏️ Editar</button>'}
  if(st&&st.tipo==='ganho'&&!l.projeto_id){b+='<button onclick="ganhoLeadCriaProj(\''+lid+'\')" class="w-full btn-primary py-2 rounded-xl text-sm">🎉 Criar projeto no ERP</button>'}
  showModal(E(l.nome)+' — CRM',b,'<button onclick="hideModal()" class="px-4 py-2 bg-input rounded-xl text-sm">Fechar</button>');
}
function editarLead(lid){
  var l=leads_global.find(function(x){return x.id===lid});if(!l)return;
  var b='<div class="space-y-3">'+
    '<div><label class="text-xs text-slate-400">Nome</label><input id="lead-nome" value="'+E(l.nome)+'" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"></div>'+
    '<div><label class="text-xs text-slate-400">Empresa</label><input id="lead-empr" value="'+E(l.empresa||'')+'" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"></div>'+
    '<div><label class="text-xs text-slate-400">Email</label><input id="lead-email" value="'+E(l.contato_email||'')+'" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"></div>'+
    '<div><label class="text-xs text-slate-400">Telefone</label><input id="lead-tel" value="'+E(l.contato_telefone||'')+'" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"></div>'+
    '<div><label class="text-xs text-slate-400">Valor (R$)</label><input id="lead-valor" type="number" value="'+(l.valor||0)+'" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"></div>'+
    '<div><label class="text-xs text-slate-400">Responsável</label><select id="lead-resp" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"><option value="">— sem atribuir —</option>'+users.map(function(uu){return'<option value="'+uu.id+'"'+(l.responsavel_id===uu.id?' selected':'')+'>'+(uu.name||'—')+'</option>'}).join('')+'</select></div>'+
    '<div><label class="text-xs text-slate-400">Próxima ação</label><input id="lead-acao" value="'+E(l.proxima_acao||'')+'" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"></div>'+
    '<div><label class="text-xs text-slate-400">Próxima data</label><input id="lead-data" type="date" value="'+(l.proxima_data||'')+'" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm"></div>'+
    '<div><label class="text-xs text-slate-400">Notas</label><textarea id="lead-notas" class="w-full bg-input border border-slate-600 rounded-xl px-4 py-3 text-white text-sm" rows="3">'+E(l.notas||'')+'</textarea></div>'+
    '</div>';
  showModal('Editar — '+E(l.nome),b,'<button onclick="hideModal()" class="px-4 py-2 bg-input rounded-xl text-sm">Cancelar</button><button onclick="salvarLead(\''+lid+'\')" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-medium">Salvar</button>');
}
async function salvarLead(lid){
  var upd={nome:$('lead-nome').value,empresa:$('lead-empr').value,contato_email:$('lead-email').value,contato_telefone:$('lead-tel').value,valor:parseFloat($('lead-valor').value)||0,responsavel_id:($('lead-resp').value||null),proxima_acao:$('lead-acao').value,proxima_data:($('lead-data').value||null),notas:$('lead-notas').value};
  await s.from('crm_leads').update(upd).eq('id',lid);hideModal();await loadData();renderPage();
}
async function novoLead(stid){
  var nome=prompt('Nome do contato:');if(!nome)return;
  await s.from('crm_leads').insert({nome:nome,stage_id:stid,created_by:u.id});await loadData();renderPage();
}
async function ganhoLeadCriaProj(lid){
  var l=leads_global.find(function(x){return x.id===lid});if(!l||l.projeto_id)return;
  if(!confirm('Criar projeto "'+l.nome+'" no ERP?'))return;
  var pr={name:l.nome,code:(l.empresa||'').substring(0,2).toUpperCase()+'_'+l.nome.substring(0,3).toUpperCase(),status:'Em andamento',current_sector_id:sectors[0].id,current_responsible_user_id:l.responsavel_id||u.id,empresa_id:'',created_at:new Date().toISOString()};
  var ins=await s.from('projects').insert([pr]).select();
  if(ins.data&&ins.data[0]){
    var proj_id=ins.data[0].id;
    await s.from('crm_leads').update({projeto_id:proj_id}).eq('id',lid);
    await s.from('stage_logs').insert({project_id:proj_id,from_stage:'Origem CRM',to_stage:'1. Análise de Vendas',date:new Date().toISOString(),user_id:u.id,notes:'Lead: '+l.nome+' ('+l.empresa+')'});
    hideModal();await loadData();renderPage();alert('✅ Projeto criado! ID: '+proj_id.substring(0,8));
  }
}
// ==================== HISTÓRICO ====================
function rHistorico(){
  var logs=stagelogs.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date)}).slice(0,150);
  var h='<p class="text-sm text-slate-400 mb-3">Últimas movimentações de todos os projetos — clique em uma linha para abrir o histórico completo do projeto</p><div class="space-y-1">';
  logs.forEach(function(l){
    var pr=projects.find(function(x){return x.id===l.project_id});
    var pn=pr?pr.name:'(projeto removido)';
    var en=pr?(empresas.find(function(x){return x.id===pr.empresa_id})?.nome||''):'';
    h+='<div class="bg-card2 rounded-xl p-3 border border-slate-800 text-sm cursor-pointer hover:ring-1 hover:ring-brand-500/30 transition" onclick="verProjeto(\''+l.project_id+'\')"><div class="flex gap-3 items-center flex-wrap"><span class="text-xs text-slate-600 w-14">'+ago(l.date)+'</span><span class="text-white font-medium">'+E(pn)+'</span>'+(en?'<span class="badge badge-blue">'+E(en)+'</span>':'')+'<span class="text-slate-400 flex-1 min-w-0">'+E(l.from_stage||'Início')+' → '+E(l.to_stage)+'</span><span class="text-xs text-slate-600">👤 '+un(l.user_id)+'</span></div>'+(isRealNote(l.notes)?'<div class="text-xs text-amber-300/80 mt-1">📝 '+E(l.notes)+'</div>':'')+'</div>';
  });
  h+='</div>';$('content').innerHTML=h;
}

// ==================== LOGIN / LOGOUT ====================
$('login-form').addEventListener('submit',async function(e){e.preventDefault();var r=await s.auth.signInWithPassword({email:$('lemail').value,password:$('lsenha').value});if(r.error){$('login-error').textContent=r.error.message;$('login-error').classList.remove('hidden');return}u=r.data.user;var pf=await s.from('users_profile').select('*').eq('id',u.id).single();if(!pf.data){await s.from('users_profile').insert({id:u.id,auth_user_id:u.id,name:u.email,email:u.email,role:'colaborador',is_ceo:false,active:true});p={id:u.id,role:'colaborador',is_ceo:false,name:u.email,email:u.email}}else p=pf.data;$('login-screen').classList.add('hidden');$('app-screen').classList.remove('hidden');nav('dashboard')});
async function logout(){await s.auth.signOut();$('app-screen').classList.add('hidden');$('login-screen').classList.remove('hidden')}
document.addEventListener('click',function(e){var pnl=$('notif-panel');if(pnl&&!pnl.classList.contains('hidden')&&!e.target.closest('#notif-panel')&&!(e.target.closest('button')&&/toggleNotifs/.test(e.target.closest('button').getAttribute('onclick')||''))){pnl.classList.add('hidden')}});
window.addEventListener('DOMContentLoaded',async function(){var r=await s.auth.getSession();if(r.data&&r.data.session&&r.data.session.user){u=r.data.session.user;var pf=await s.from('users_profile').select('*').eq('id',u.id).single();p=pf.data;$('login-screen').classList.add('hidden');$('app-screen').classList.remove('hidden');nav('dashboard')}});
</script>
