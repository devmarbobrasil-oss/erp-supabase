<style>
*{margin:0;padding:0;box-sizing:border-box}

/* GRADIENTE DE FUNDO ANIMADO */
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 20% 50%,rgba(99,102,241,0.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(6,182,212,0.06) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(139,92,246,0.05) 0%,transparent 50%);pointer-events:none;z-index:0;animation:bgShift 20s ease infinite}
@keyframes bgShift{0%,100%{transform:translate(0,0)}33%{transform:translate(1%,-1%)}66%{transform:translate(-1%,1%)}}
/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(99,102,241,0.3);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:rgba(99,102,241,0.5)}

.glass{background:rgba(17,24,39,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.06)}
.glass-strong{background:rgba(17,24,39,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08)}
/* ANIMAÇÕES */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideRight{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,0.4)}50%{box-shadow:0 0 20px 5px rgba(99,102,241,0.15)}}
@keyframes ping-red{0%{box-shadow:0 0 0 0 rgba(239,68,68,0.5)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.fade-up{animation:fadeUp .4s cubic-bezier(.16,1,.3,1)}
.fade-in{animation:fadeIn .3s ease}
.slide-right{animation:slideRight .35s cubic-bezier(.16,1,.3,1)}
.ping{animation:ping-red 2s infinite}
/* CARDS */
.card-hover{transition:all .25s cubic-bezier(.16,1,.3,1)}
.card-hover:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.4),0 0 0 1px rgba(99,102,241,0.15)}
/* GLOW BORDERS */
.glow-border{position:relative}
.glow-border::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(99,102,241,0.4),rgba(6,182,212,0.2),rgba(139,92,246,0.3));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
/* BOTÕES */
.btn-primary{background:linear-gradient(135deg,#6366f1,#4f46e5);border:none;color:#fff;font-weight:600;transition:all .2s;box-shadow:0 4px 15px rgba(99,102,241,0.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 25px rgba(99,102,241,0.45)}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#cbd5e1;transition:all .2s}
.btn-ghost:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 15px rgba(239,68,68,0.3)}
.btn-danger:hover{box-shadow:0 6px 25px rgba(239,68,68,0.45)}
/* BADGES */
.badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:.02em}
.badge-green{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.2)}
.badge-yellow{background:rgba(234,179,8,0.12);color:#facc15;border:1px solid rgba(234,179,8,0.2)}
.badge-red{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.2)}
.badge-blue{background:rgba(59,130,246,0.12);color:#60a5fa;border:1px solid rgba(59,130,246,0.2)}
.badge-purple{background:rgba(139,92,246,0.12);color:#a78bfa;border:1px solid rgba(139,92,246,0.2)}

.stat-card{background:rgba(17,24,39,0.5);border:1px solid rgba(255,255,255,0.05);border-radius:16px;padding:20px;transition:all .25s cubic-bezier(.16,1,.3,1)}
.stat-card:hover{background:rgba(17,24,39,0.7);border-color:rgba(99,102,241,0.15);box-shadow:0 4px 20px rgba(0,0,0,0.25)}

input,select,textarea{background:rgba(15,23,42,0.8)!important;border:1px solid rgba(255,255,255,0.08)!important;border-radius:12px!important;color:#e2e8f0!important;transition:all .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(99,102,241,0.5)!important;box-shadow:0 0 0 3px rgba(99,102,241,0.1)!important}
/* PROGRESS BAR */
.progress-bar{height:4px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.16,1,.3,1)}
/* TOOLTIP */
[data-tooltip]{position:relative}
[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;padding:8px 12px;border-radius:8px;font-size:11px;line-height:1.4;white-space:normal;width:max-content;max-width:240px;text-align:center;z-index:100;border:1px solid rgba(255,255,255,0.1);pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
/* SECTION DIVIDER */
.section-title{font-size:13px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
</style>

// Funções auxiliares do BPM
function getBpmStep(pr){
  // Encontra o step atual pelo último stage_log, casando a FASE exata do BPM.
  // (parsing por número quebrava em sub-etapas 7.1/15.x e na fase 'Medição / Faturamento' sem número)
  var lg=stagelogs.filter(function(l){return l.project_id===pr.id}).sort(function(a,b){return new Date(b.date)-new Date(a.date)})[0];
  if(!lg||!lg.to_stage)return 1;
  var to=lg.to_stage;
  if(to==='Comercial'||to==='Início'||to==='Inicio')return 1;
  // Remove sufixo de pendência para casar a fase base
  var base=to.replace(/ \(pendente\)$/,'');
  var byPhase=BPM.find(function(b){return b.phase===base});
  if(byPhase)return byPhase.step;
  // Fallback legado: extrai número decimal, mas só retorna se o step existir de fato
  var m=base.match(/^(\d+(?:\.\d+)?)[.\s]/);
  if(m){var st=parseFloat(m[1]);if(getBpmByStep(st))return st;}
  return 1;
}
function getBpmByStep(step){return BPM.find(function(b){return b.step===step})}
function getBpmSectorUsers(step){
  var b=getBpmByStep(step);if(!b)return[];
  return gU(b.uuid);
}
function getBpmNextStep(step,allYes){
  var b=getBpmByStep(step);if(!b)return null;
  return allYes?b.nextYes:b.nextNo;
}
function getBpmNotifyUser(step){
  var b=getBpmByStep(step);if(!b)return null;
  if(!b.notify)return null;
  var emails={André:'andre@fujitecbrasil.com.br',Nathalia:'nathalia@fujitecbrasil.com.br',Fábio:'ceo@fujitecbrasil.com.br',Tainá:'taina@fujitecbrasil.com.br'};
  var em=emails[b.notify];if(!em)return null;
  return users.find(function(x){return x.email===em});
}

function getVisited(pid){
  var seen=[];
  stagelogs.filter(function(l){return l.project_id===pid}).forEach(function(l){
    if(l.to_stage&&l.to_stage.indexOf('pendente')<0&&l.to_stage!=='Finalizado'&&seen.indexOf(l.to_stage)<0)
      seen.push(l.to_stage);
  });
  return seen;
}

// ==================== MOTOR DE AVANÇO BPM ====================
async function showAvancar(pid){
  pidAv=pid;curDec=0;dec='';routeTarget=null;
  var pr=projects.find(function(x){return x.id===pid});if(!pr)return;
  if(pr.status==='Finalizado'||pr.status==='Cancelado'){alert('Projeto já encerrado ('+pr.status+'). Não é possível avançar.');return;}
  var curStep=getBpmStep(pr);
  var b=getBpmByStep(curStep);if(!b){alert('Fase nao encontrada');return}
  decs=b.decisions||[];
  rBpmSetor(pr,b);
}
function rBpmSetor(pr,b){
  var b2='<div class="space-y-4"><div class="glass rounded-2xl p-4 border border-white/5"><p class="text-xs text-slate-500">'+b.phase+'</p><p class="text-sm text-slate-400 mt-0.5">'+b.desc+'</p><p class="text-xs mt-2">👤 <span class="text-white">'+b.resp+'</span> | 🏢 <span class="text-slate-400">'+b.sector+'</span></p></div>';
  if(b.nextYes===-1){b2+='<div class="glass rounded-2xl p-4 border border-green-500/20 text-center"><p class="text-lg font-bold text-green-400">🏁 ULTIMA FASE</p></div>'}
  else{var nb=getBpmByStep(b.nextYes);b2+='<div class="glass rounded-2xl p-4 border border-brand-500/20"><p class="text-xs text-slate-500">✅ SIM →</p><p class="text-sm font-bold text-brand-400">'+(nb?nb.phase:'Fase '+b.nextYes)+'</p></div>'}
  b2+='</div>';
  $('mtitle').textContent=b.phase+' - '+E(pr.name);
  $('mbody').innerHTML=b2;
  $('mfooter').innerHTML='<button onclick="hideModal()" class="btn-ghost px-4 py-2 text-xs rounded-xl">Cancelar</button><button onclick="rDec()" class="btn-primary px-6 py-3 text-xs rounded-xl font-medium">Abrir Decisao →</button>';
  $('modal').classList.remove('hidden');
}
function rDec(){
  if(curDec>=decs.length){rBpmFinal();return}
  var d=decs[curDec],pr=projects.find(function(x){return x.id===pidAv}),b=getBpmByStep(getBpmStep(pr));
  $('mtitle').textContent='Decisao - '+E(pr.name);
  var b2='<div class="text-center py-4"><div class="glass rounded-2xl p-6 border border-yellow-500/20"><p class="text-xs text-slate-500 mb-1">'+(b?b.phase:'')+'</p><p class="text-lg font-semibold text-white mb-2">'+d.q+'</p><div class="flex gap-4 justify-center mt-6"><button onclick="rDecResult(true)" class="px-8 py-4 bg-green-600 hover:bg-green-700 text-white rounded-xl text-base font-bold transition">✅ SIM<br><span class="text-xs font-normal">'+d.yes+'</span></button><button onclick="rDecResult(false)" class="px-8 py-4 bg-red-600 hover:bg-red-700 text-white rounded-xl text-base font-bold transition">❌ NAO<br><span class="text-xs font-normal">'+d.no+'</span></button></div></div></div>';
  $('mbody').innerHTML=b2;
  $('mfooter').innerHTML='<button onclick="if(curDec>0){curDec--;rDec()}else{showAvancar(pidAv)}" class="btn-ghost px-4 py-2 text-xs rounded-xl">← Voltar</button>';
}
function rDecResult(isYes){dec+=(dec?' | ':'')+(isYes?'✅':'❌');curDec++;rDec()}

function rBpmFinal(){
  var pr=projects.find(function(x){return x.id===pidAv});if(!pr)return;
  var curStep=getBpmStep(pr);
  var b=getBpmByStep(curStep);if(!b)return;
  var allYes=dec.indexOf('❌')<0;
  var nxtStep=allYes?b.nextYes:b.nextNo;
  var nb=getBpmByStep(nxtStep);
  // Colaboradores do PRÓXIMO setor
  var nxtUsers=nb?gU(nb.uuid):getBpmSectorUsers(curStep);
  if(!nxtUsers||nxtUsers.length===0)nxtUsers=gU(b.uuid);
  if(nxtUsers.length===0)return alert('Sem colaboradores');
  var opts=nxtUsers.map(function(x){return'<option value="'+x.id+'">'+E(x.name)+'</option>'}).join('');
  // Delegação
  var delOpts='';
  if(b.delegar&&p&&p.name==='André'){
    var dels=users.filter(function(x){return b.delegar.indexOf(x.name.split(' ')[0])>=0});
    delOpts='<div><label class="text-xs text-amber-400 mt-2">Delegar para:</label><div class="flex gap-2 mt-1">'+
      dels.map(function(x){return'<label class="flex items-center gap-1 text-xs text-slate-300 cursor-pointer"><input type="radio" name="av-delegar" value="'+x.name+'" class="accent-amber-500"> '+x.name+'</label>'}).join('')+
    '</div></div>';
  }
  var nxtLabel=nb?nb.sector:b.sector;
  $('mtitle').textContent='Finalizar - '+E(pr.name);
  var b2='<div class="space-y-4"><div class="glass rounded-2xl p-3 border border-white/5"><p class="text-xs text-slate-500">Fase atual: '+b.phase+'</p><p class="text-xs text-slate-400">👤 '+b.resp+' | 🏢 '+b.sector+'</p></div>';
  b2+='<div class="glass rounded-2xl p-3 border border-white/5"><p class="text-xs text-slate-500">Decisao:</p><p class="text-sm text-slate-300 mt-1">'+(allYes?'✅ SIM':'❌ NAO')+'</p></div>';
  if(nxtStep===-1&&allYes){b2+='<div class="glass rounded-2xl p-3 border border-green-500/20 text-center"><p class="text-sm font-bold text-green-400">🏁 PROJETO FINALIZADO</p></div>'}
  else if(nb){b2+='<div class="glass rounded-2xl p-3 border '+(allYes?'border-green-500/20':'border-red-500/20')+' text-center"><p class="text-sm font-bold '+(allYes?'text-green-400':'text-red-400')+'">'+(allYes?'✅ Avancar p/ '+nb.phase:'❌ Pendencia em '+b.phase)+'</p></div>'}
  else{b2+='<div class="glass rounded-2xl p-3 border border-yellow-500/20 text-center"><p class="text-sm font-bold text-yellow-400">⚠️ Fluxo interrompido</p></div>'}
  b2+='<div><label class="text-xs text-slate-400">Responsavel do proximo setor ('+nxtLabel+') *</label><select id="av-resp" class="w-full px-4 py-3 text-white text-sm mt-1">'+opts+'</select></div>'+delOpts+'<div><label class="text-xs text-slate-400">Observacao</label><textarea id="av-notes" rows="2" class="w-full px-4 py-3 text-white text-sm mt-1"></textarea></div></div>';
  $('mbody').innerHTML=b2;
  $('mfooter').innerHTML='<button onclick="showAvancar(pidAv)" class="btn-ghost px-4 py-2 text-xs rounded-xl">← Voltar</button><button onclick="doAv()" class="btn-primary px-6 py-3 text-xs rounded-xl font-medium">✅ Confirmar</button>';
}

async function doAv(){
  var pid=pidAv,pr=projects.find(function(x){return x.id===pid});if(!pr)return;
  var curStep=getBpmStep(pr);
  var b=getBpmByStep(curStep);if(!b)return;
  var allYes=dec.indexOf('❌')<0;
  var nxtStep=allYes?b.nextYes:b.nextNo;
  var resp=$('av-resp')?$('av-resp').value:'',notes=$('av-notes')?$('av-notes').value.trim():'';
  if(!resp)return alert('Selecione um responsavel');
  var uResp=users.find(function(x){return x.id===resp});
  if(!uResp)return alert('Responsavel invalido');
  var nxtBpm=getBpmByStep(nxtStep);
  // Verifica duplicata: se ultimo stage_log é igual, bloqueia
  var lastLog=stagelogs.filter(function(l){return l.project_id===pid}).sort(function(a,b){return new Date(b.date)-new Date(a.date)})[0];
  var newTo='';
  if(allYes&&nxtStep===-2)newTo='Declinado';
  else if(allYes&&nxtStep===-1)newTo='Finalizado';
  else if(allYes&&nxtBpm)newTo=nxtBpm.phase;
  else newTo=b.phase+' (pendente)';
  if(lastLog&&lastLog.to_stage===newTo&&lastLog.from_stage===b.phase){
    return alert('Este avanco ja foi registrado. Atualize a pagina.');
  }
  if(allYes&&nxtStep===-2){await s.from("projects").update({current_responsible_user_id:resp,status:"Cancelado",finalized_at:new Date().toISOString()}).eq("id",pid);await s.from("stage_logs").insert({project_id:pid,from_stage:b.phase,to_stage:"Declinado",user_id:u.id,notes:"Pedido declinado"});await s.from("notifications").insert({project_id:pid,user_id:resp,type:"declined",title:"❌ Declinado: "+E(pr.name),message:"Projeto "+E(pr.name)+" declinado",status:"pendente"});}
  if(allYes&&nxtStep===-1){
    await s.from('projects').update({current_responsible_user_id:resp,status:'Finalizado',finalized_at:new Date().toISOString()}).eq('id',pid);
    await s.from('stage_logs').insert({project_id:pid,from_stage:b.phase,to_stage:'Finalizado',user_id:u.id,notes:'Projeto finalizado'});
    await s.from('notifications').insert({project_id:pid,user_id:resp,type:'finalized',title:'🏁 Finalizado: '+E(pr.name),message:'Projeto '+E(pr.name)+' finalizado',status:'pendente'});
  }else if(allYes&&nxtBpm){
    await s.from('projects').update({current_sector_id:nxtBpm.uuid,current_responsible_user_id:resp}).eq('id',pid);
    await s.from('stage_logs').insert({project_id:pid,from_stage:b.phase,to_stage:nxtBpm.phase,user_id:u.id,notes:notes||dec});
    await s.from('notifications').insert({project_id:pid,user_id:resp,type:'flow_received',title:'✅ '+b.phase+'→'+nxtBpm.phase,message:'Projeto '+E(pr.name)+' avancou. Resp: '+E(uResp.name),status:'pendente'});
  }else{
    await s.from('projects').update({current_responsible_user_id:resp}).eq('id',pid);
    await s.from('stage_logs').insert({project_id:pid,from_stage:b.phase,to_stage:b.phase+' (pendente)',user_id:u.id,notes:notes||dec});
    await s.from('notifications').insert({project_id:pid,user_id:resp,type:'stalled',title:'❌ Pendencia: '+E(pr.name),message:'Projeto '+E(pr.name)+' com pendencia em '+b.phase,status:'pendente'});
  }
  var gestor=getBpmNotifyUser(curStep);
  if(gestor&&gestor.id!==resp){
    await s.from('notifications').insert({project_id:pid,user_id:gestor.id,type:'flow_received',title:'📢 '+b.phase,message:(allYes?'✅ Avancou':'❌ Pendencia')+' | '+E(pr.name)+' | '+E(uResp.name),status:'pendente'});
  }
  hideModal();await loadData();renderPage();
}

// ==================== MEUS FLUXOS ====================
function rFluxos(){
  var meusSetores=[p.main_sector_id].concat(userSectors.filter(function(us){return us.user_id===p.id}).map(function(us){return us.sector_id}));
  var meusSetoresNomes=meusSetores.map(function(sid){return sn(sid)}).filter(function(v,i,a){return a.indexOf(v)===i});
  var pjs=projects.filter(function(pr){return pr.current_responsible_user_id===u.id});
  var h='<div class="mb-6 glass-strong rounded-2xl p-5 glow-border"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-500 to-accent-500 flex items-center justify-center text-lg font-black text-white shadow-lg shadow-brand-500/20">'+(p&&p.name?p.name[0]:'?')+'</div><div><h3 class="text-lg font-bold text-white">'+E(p?p.name:'')+'</h3><p class="text-xs text-slate-400">'+E(p?p.email:'')+'</p><div class="flex flex-wrap gap-1 mt-1.5">';
  meusSetoresNomes.forEach(function(sn){h+='<span class="badge badge-blue">'+sn+'</span>'});
  h+='</div></div></div>';
  h+='<div class="flex justify-between items-center mb-4"><p class="text-sm text-slate-400"><span class="text-brand-400 font-semibold">'+pjs.length+'</span> atividade(s) designada(s) para você</p></div>';
  if(pjs.length===0){h+='<div class="text-center py-16 glass rounded-2xl"><div class="text-5xl mb-3">📭</div><p class="text-slate-400">Nenhuma atividade pendente</p><p class="text-xs text-slate-600 mt-1">Quando um projeto chegar no seu setor, aparecerá aqui</p></div>';$('content').innerHTML=h;return}
  h+='<div class="space-y-3">';
  pjs.forEach(function(pr){
    var dias=getTimeInSector(pr.id);
    var td=dias>3?'border-red-500/50 bg-red-500/3':dias>1?'border-yellow-500/30 bg-yellow-500/3':'border-brand-500/20 bg-brand-500/3';
    var tdText=dias>3?'text-red-400':dias>1?'text-yellow-400':'text-green-400';
    var empNome=empresas.find(function(x){return x.id===pr.empresa_id})?.nome||'---';
    var setorNome=sn(pr.current_sector_id);
    var setorColor=sc(pr.current_sector_id);
    h+='<div class="glass rounded-2xl p-5 border '+td+' card-hover cursor-pointer" onclick="verProjeto(\''+pr.id+'\')"><div class="flex justify-between items-start"><div class="flex-1"><div class="flex items-center gap-2 mb-1"><span class="badge" style="background:'+setorColor+'20;color:'+setorColor+';border:1px solid '+setorColor+'40">'+setorNome+'</span><span class="text-xs '+tdText+' font-semibold">⏱ '+dias+'d</span></div><h3 class="font-semibold text-white text-base">'+E(pr.name)+'</h3><p class="text-xs text-slate-500 mt-0.5">🏢 '+E(empNome)+'</p><p class="text-xs text-slate-500 mt-1">📋 Ação: <span class="text-white">Revisar e avançar fluxo</span></p></div><button onclick="event.stopPropagation();showAvancar(\''+pr.id+'\')" class="btn-primary px-4 py-2 text-xs rounded-xl flex-shrink-0">▶ Avançar</button></div></div>';
  });
  h+='</div>';$('content').innerHTML=h;
}

// ==================== VISÃO GERAL (CEO) ====================
function rVisao(){
  var h='<div class="mb-4 flex justify-between items-center"><p class="text-sm text-slate-400">'+empresas.length+' empresas · '+projects.filter(function(p){return p.status!=='Finalizado'}).length+' projetos ativos</p></div>';
  var ativos=projects.filter(function(p){return p.status!=='Finalizado'});
  var secs=sectors.filter(function(x){return x.active});
  if(ativos.length===0){h+='<div class="text-center text-slate-500 py-12">Nenhum projeto ativo.</div>';$('content').innerHTML=h;return}
  var empMap={};
  ativos.forEach(function(pr){var eid=pr.empresa_id||'sem_empresa';if(!empMap[eid])empMap[eid]={emp:empresas.find(function(x){return x.id===eid})||{id:eid,nome:'Sem empresa'},projs:[]};empMap[eid].projs.push(pr)});
  h+='<div class="overflow-x-auto"><table class="w-full text-sm border-collapse"><thead><tr><th class="text-left px-3 py-2 bg-card2 text-slate-400 font-medium sticky left-0 z-10 rounded-tl-xl">Empresa</th><th class="px-3 py-2 bg-card2 text-slate-400 font-medium text-center">Qtd</th>';
  secs.forEach(function(sec){h+='<th class="px-3 py-2 bg-card2 text-slate-400 font-medium text-center whitespace-nowrap">'+E(sec.name)+'</th>'});
  h+='</tr></thead><tbody>';
  var keys=Object.keys(empMap).sort(function(a,b){return(empMap[a].emp.nome||'').localeCompare(empMap[b].emp.nome||'')});
  keys.forEach(function(k,i){var row=empMap[k];h+='<tr class="'+(i%2===0?'bg-card/50':'bg-card2/30')+' hover:bg-brand-600/10 transition"><td class="px-3 py-2.5 font-medium text-white whitespace-nowrap sticky left-0 '+(i%2===0?'bg-card':'bg-card2')+' border-r border-slate-800">'+E(row.emp.nome)+'</td><td class="px-3 py-2.5 text-center text-brand-400 font-semibold">'+row.projs.length+'</td>';
    secs.forEach(function(sec){var cell=row.projs.filter(function(pr){return pr.current_sector_id===sec.id});if(cell.length===0){h+='<td class="px-3 py-2.5 text-center text-slate-600">—</td>';return}
      h+='<td class="px-2 py-2"><div class="space-y-1">';
      cell.forEach(function(pr){var dias=getTimeInSector(pr.id);var cls=dias>3?'text-red-400':dias>1?'text-yellow-400':'text-green-400';
        h+='<div class="bg-card rounded-lg px-2 py-1 text-xs cursor-pointer hover:ring-1 hover:ring-brand-500/50" style="border-left:3px solid '+sc(sec.id)+'" onclick="verProjeto(\''+pr.id+'\')"><span class="text-white">'+E(pr.name||pr.code)+'</span> <span class="'+cls+'">'+dias+'d</span></div>';
      });
      h+='</div></td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div><p class="text-xs text-slate-600 mt-4">🟢 Até 1d no setor · 🟡 2-3d · 🔴 +3d (gargalo)</p>';
  $('content').innerHTML=h;
}

// ==================== GARGALOS ====================
function rGargalos(){var list=[];projects.forEach(function(pr){if(pr.status==='Finalizado')return;var d=getTimeInSector(pr.id);if(d>2)list.push({p:pr,dias:d})});list.sort(function(a,b){return b.dias-a.dias});var h='<h3 class="text-sm font-semibold text-white mb-4">⚠️ Parados >2d ('+list.length+')</h3><div class="space-y-3">';list.forEach(function(g){h+='<div class="bg-card2 rounded-2xl p-5 border border-slate-800 cursor-pointer" onclick="verProjeto(\''+g.p.id+'\')"><h3 class="font-semibold text-white">'+E(g.p.name)+'</h3><span class="text-xs text-red-400">🔴 '+g.dias+'d</span> · '+sn(g.p.current_sector_id)+' · 👤 '+un(g.p.current_responsible_user_id)+'</div>'});h+='</div>';$('content').innerHTML=h}

// ==================== DETALHE DO PROJETO ====================
function verProjeto(pid){
  var pr=projects.find(function(x){return x.id===pid});if(!pr)return;
  viewingDetail=true; // evita que o auto-refresh de 30s tire o usuário da tela de detalhe
  var logs=stagelogs.filter(function(x){return x.project_id===pid}).sort(function(a,b){return new Date(b.date)-new Date(a.date)});
  var diasNoSetor=getTimeInSector(pid);
  var td=diasNoSetor>3?'text-red-400':diasNoSetor>1?'text-yellow-400':'text-green-400';
  var btnEdit=canEdit()?'<button onclick="showEditarProjeto(\''+pid+'\')" class="px-3 py-1.5 text-xs bg-input text-slate-300 rounded-xl">✏️</button>':'';
  var btnDel=canDelete()?'<button onclick="excluirProjeto(\''+pid+'\')" class="px-3 py-1.5 text-xs bg-red-600 text-white rounded-xl">🗑</button>':'';
  var h='<div class="mb-4"><button onclick="nav(\'projetos\')" class="text-slate-400 hover:text-white text-sm">&larr; Voltar</button><div class="flex justify-between mt-2"><div><h3 class="text-lg font-semibold text-white">'+E(pr.name)+'</h3><p class="text-xs text-slate-400">'+E(empresas.find(function(x){return x.id===pr.empresa_id})?.nome||'')+'</p></div><div class="flex gap-2">'+btnEdit+'<button onclick="showAvancar(\''+pid+'\')" class="px-3 py-1.5 text-xs bg-brand-600 text-white rounded-xl">▶ Avançar</button>'+btnDel+'</div></div></div>';
  h+='<div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">'+dc2('Setor',sn(pr.current_sector_id),sc(pr.current_sector_id))+dc2('Status',pr.status,'')+dc2('Responsavel',un(pr.current_responsible_user_id),'')+dc2('Criado',fd(pr.created_at),'')+dc2('⏱ No setor',diasNoSetor+'d',(diasNoSetor>3?'#f87171':diasNoSetor>1?'#fbbf24':'#4ade80'))+'</div>';
  h+='<h4 class="text-sm font-semibold text-white mb-2">📊 Auditoria</h4>';
  var tempoTotal=0;logs.forEach(function(l,i){if(i<logs.length-1){tempoTotal+=Math.floor((new Date(logs[i].date)-new Date(logs[i+1].date))/86400000)}});
  var media=logs.length>1?Math.round(tempoTotal/(logs.length-1)):0;
  h+='<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">';
  h+=dc2('Transicoes',logs.length,'#6366f1')+dc2('Dias no Setor',diasNoSetor,diasNoSetor>3?'#f87171':diasNoSetor>1?'#fbbf24':'#4ade80')+dc2('Tempo Total',tempoTotal+'d','#a78bfa')+dc2('Media/Transicao',media+'d',media>7?'#f87171':'#4ade80');
  h+='</div>';
  h+='<h4 class="text-sm font-semibold text-white mb-2">🕐 Historico</h4><div class="space-y-1">';
  logs.forEach(function(l,i){var dt=ago(l.date);var nextLog=i>0?logs[i-1]:null;var dur='';if(nextLog){var m=Math.floor((new Date(nextLog.date)-new Date(l.date))/60000);if(m<60)dur=m+'min';else if(m<1440)dur=Math.floor(m/60)+'h';else dur=Math.floor(m/1440)+'d'}else{dur='atual'}var udur=dur==='atual'?'text-green-400':parseInt(dur)>1440?'text-red-400':'text-slate-500';h+='<div class="bg-card2 rounded-xl p-3 border border-slate-800 text-sm flex gap-3"><span class="text-xs text-slate-600 w-16">'+dt+'</span><span class="text-slate-300 flex-1">'+E(l.from_stage||'Inicio')+' → '+E(l.to_stage)+'</span><span class="text-xs '+udur+' w-16 text-right">'+dur+'</span><span class="text-xs text-slate-600 w-24 text-right">👤 '+un(l.user_id)+'</span></div>'});
  h+='</div>';$('content').innerHTML=h;
}
function dc2(l,v,c){var cl=(c==='white'||!c)?'#e2e8f0':c;return'<div class="stat-card"><p class="text-xs text-slate-500 uppercase tracking-wide">'+l+'</p><p style="color:'+cl+'" class="font-semibold mt-1 text-lg">'+E(v)+'</p></div>'}
async function excluirProjeto(pid){if(confirm('Excluir?')){await s.from('projects').delete().eq('id',pid);await loadData();nav('projetos')}}

// ==================== EQUIPE ====================
function rEquipe(){var h='<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';users.forEach(function(us){h+='<div class="bg-card2 rounded-2xl p-5 border border-slate-800"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-brand-600/20 flex items-center justify-center text-brand-400 font-bold">'+(us.name||'?')[0]+'</div><div><p class="font-medium text-white">'+E(us.name)+'</p><p class="text-xs text-slate-500">'+E(us.email)+'</p></div></div><span class="text-xs px-2 py-0.5 rounded-full '+(us.is_ceo?'bg-yellow-500/20 text-yellow-400':'bg-blue-500/20 text-blue-400')+'">'+(us.is_ceo?'CEO':us.role)+'</span></div>'});h+='</div>';$('content').innerHTML=h}

// ==================== SETORES ====================
function rSetores(){var h='<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';sectors.filter(function(x){return x.active}).forEach(function(sec){var c=projects.filter(function(pr){return pr.current_sector_id===sec.id}).length;var us=gU(sec.id);h+='<div class="bg-card2 rounded-2xl p-5 border border-slate-800 cursor-pointer hover:ring-1 hover:ring-brand-500/30 transition" style="border-left:4px solid '+sec.color+'" onclick="filtrarSetor(\''+sec.id+'\')"><span class="font-semibold text-white">'+E(sec.name)+'</span><p class="text-2xl font-bold mt-1" style="color:'+sec.color+'">'+c+'</p><p class="text-xs text-slate-500 mt-2">'+us.length+' colaborador(es):</p><div class="flex flex-wrap gap-1 mt-1">';us.forEach(function(uu){h+='<span class="text-xs px-2 py-0.5 rounded-full bg-slate-700 text-slate-300">'+E(uu.name)+'</span>'});h+='</div></div>'});h+='</div>';$('content').innerHTML=h}

// ==================== HISTÓRICO ====================
function rHistorico(){var h='<div class="space-y-1">';stagelogs.sort(function(a,b){return new Date(b.date)-new Date(a.date)}).slice(0,100).forEach(function(l){h+='<div class="bg-card2 rounded-xl p-3 border border-slate-800 text-sm flex gap-3"><span class="text-xs text-slate-600 w-14">'+ago(l.date)+'</span><span class="text-slate-300">'+E(l.from_stage||'Início')+' → '+E(l.to_stage)+'</span><span class="text-xs text-slate-600">'+un(l.user_id)+'</span></div>'});h+='</div>';$('content').innerHTML=h}

// ==================== LOGIN / LOGOUT ====================
$('login-form').addEventListener('submit',async function(e){e.preventDefault();var r=await s.auth.signInWithPassword({email:$('lemail').value,password:$('lsenha').value});if(r.error){$('login-error').textContent=r.error.message;$('login-error').classList.remove('hidden');return}u=r.data.user;var pf=await s.from('users_profile').select('*').eq('id',u.id).single();if(!pf.data){await s.from('users_profile').insert({id:u.id,auth_user_id:u.id,name:u.email,email:u.email,role:'colaborador',is_ceo:false,active:true});p={id:u.id,role:'colaborador',is_ceo:false,name:u.email,email:u.email}}else p=pf.data;$('login-screen').classList.add('hidden');$('app-screen').classList.remove('hidden');nav('dashboard')});
async function logout(){await s.auth.signOut();$('app-screen').classList.add('hidden');$('login-screen').classList.remove('hidden')}
document.addEventListener('click',function(e){var pnl=$('notif-panel');if(pnl&&!pnl.classList.contains('hidden')&&!e.target.closest('#notif-panel')&&!(e.target.closest('button')&&/toggleNotifs/.test(e.target.closest('button').getAttribute('onclick')||''))){pnl.classList.add('hidden')}});
window.addEventListener('DOMContentLoaded',async function(){var r=await s.auth.getSession();if(r.data&&r.data.session&&r.data.session.user){u=r.data.session.user;var pf=await s.from('users_profile').select('*').eq('id',u.id).single();p=pf.data;$('login-screen').classList.add('hidden');$('app-screen').classList.remove('hidden');nav('dashboard')}});
</script>
